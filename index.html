<!DOCTYPE html>
<html>
    <head>
        <title>Beyond Immigration Enforcement: Mapping the Experience of UCLA Pilipinx Students  </title>
        <meta charset="utf-8" />
        <link rel="shortcut icon" href="#">
        <link rel="stylesheet" href="styles/style.css">
        <style>
            .survey-controls {
                width: 100%;
                margin-bottom: 1rem;
                text-align: center;
            }

            .survey-toggle {
                padding: 0.6rem 1rem;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.95rem;
            }

            .survey-panel {
                display: none;
                width: 100%;
                margin-top: 0.75rem;
            }

            .survey-panel iframe {
                width: 100%;
                min-height: 540px;
                border: none;
            }
        </style>

        <!-- MapLibreGL's css-->
        <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.css" />

        <!-- MapLibreGL's JavaScript-->
        <script src="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    </head>

    <body>
        <header>
            Mapping the Experience of UCLA Pilipinx Students
        </header>

        <main>
            <div class="portfolio">
                <div id="contents">
                </div>
                <div class="survey-controls">
                    <button id="survey-toggle" class="survey-toggle" type="button">Open Survey</button>
                </div>
                <div id="survey-panel" class="survey-panel">
                    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScaFLlkRnyKGnaQxl3_EysLghpz6ydfYeeQfF9LGE_hYdlZbA/viewform?embedded=true" title="Survey Form">Loading…</iframe>
                </div>
            </div>
            <div id="map"></div>
        </main>
        <div id="footer">
            Copyright(2026)
        </div>
        <script src="js/init.js"></script>
    </body>
</html>
